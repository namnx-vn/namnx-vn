name: 🐍 Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: namnx-vn
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit generated assets
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore(profile): refresh contribution snake"
          default_author: github_actions
          add: "assets/github-contribution-grid-snake*.svg"
